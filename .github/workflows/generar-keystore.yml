name: Generar Keystore Fijo

on:
  push:
    paths:
      - '.github/workflows/generar-keystore.yml'
  workflow_dispatch:

jobs:
  crear-llave:
    runs-on: ubuntu-latest
    steps:
      - name: Generar keystore
        run: |
          keytool -genkeypair -v \
            -keystore indrhi-emergencias.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias indrhi_key \
            -storepass Indrhi2026! \
            -keypass Indrhi2026! \
            -dname "CN=INDRHI Emergencias, OU=TI, O=INDRHI, L=Santo Domingo, S=DN, C=DO"

      - name: Subir respaldo de llave
        uses: actions/upload-artifact@v4
        with:
          name: indrhi-keystore-backup
          path: indrhi-emergencias.jks

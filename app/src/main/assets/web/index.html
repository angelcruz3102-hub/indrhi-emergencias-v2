<script>
(function(){
var B=window.IndrhiBridge,ADMIN_MAIL='ajfeliz@indrhi.gob.do';
var FS='https://firestore.googleapis.com/v1/projects/indrhi-emergencias/databases/(default)/documents';
var DEFAULT_APK_URL='https://github.com/angelcruz3102-hub/indrhi-emergencias-v2/releases/latest/download/app-debug.apk';

/* Coordenadas Sede Central INDRHI (Centro de los Héroes, Santo Domingo) y radio de seguridad (1000 m) */
var INDRHI_HQ={lat:18.4488,lng:-69.9265,radiusMeters:1000};

var BRIG=[
 'Brigada de Evacuación y Rescate',
 'Brigada Contra Incendio y M. Extintores',
 'Brigada de Rescate',
 'Brigada Médica / Primeros Auxilios',
 'Brigada de Comunicación y Apoyo'
];
var ADM_AREAS=[
 'Administración',
 'Tecnología',
 'Recursos Humanos'
];
var BRIG_ROOMS={
 'Brigada de Evacuación y Rescate':{id:'grupo_brig_evacuacion',nombre:'Brigada de Evacuación y Rescate'},
 'Brigada Contra Incendio y M. Extintores':{id:'grupo_brig_incendio',nombre:'Brigada Contra Incendio y M. Extintores'},
 'Brigada de Rescate':{id:'grupo_brig_rescate',nombre:'Brigada de Rescate'},
 'Brigada Médica / Primeros Auxilios':{id:'grupo_brig_medicos',nombre:'Brigada Médica / Primeros Auxilios'},
 'Brigada de Comunicación y Apoyo':{id:'grupo_brig_comunicacion',nombre:'Brigada de Comunicación y Apoyo'}
};
var LEGACY_BRIG={
 'Brigada de Evacuación':'Brigada de Evacuación y Rescate',
 'Brigada Contra Incendios':'Brigada Contra Incendio y M. Extintores',
 'Brigada de Búsqueda y Rescate':'Brigada de Rescate',
 'Brigada de Primeros Auxilios':'Brigada Médica / Primeros Auxilios'
};

var UBIC=['Edificio ED1','Edificio ED2','Exterior / Regional'];
var TOPICS={'Edificio ED1':'indrhi_ed1','Edificio ED2':'indrhi_ed2','Exterior / Regional':'indrhi_exterior'};
var TIPOS=['Información','Curso','Reunión','Encuesta'];
var DEST=['Todos','Edificio ED1','Edificio ED2','Brigadistas (Todas)'].concat(BRIG).concat(['Seguridad (Todos)','Jefe de Seguridad','Subalternos de Seguridad']);

var IC={
 alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18h.01"/></svg>',
 board:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
 chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-12 7l-5 1 1-4a8 8 0 1 1 16-4z"/></svg>',
 user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>',
 cam:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>'};

var S={tab:'emg',tabHist:[],filter:'Todos',session:null,posts:[],reports:[],users:[],groups:[],room:null,msgs:[],ver:null,health:null,fcm:'',upd:'',updState:'',sirena:false,globalSiren:null,lastRemoteActive:false,R:{step:0},mode:'login',busy:false,cfg:null,adminQ:'',pollOpts:['',''],grpFilter:'Todos',media:{emerg:null,board:null,chat:null},pickSlot:'emerg',webhook:'',geofenceOn:true};
var $=function(s){return document.querySelector(s)};
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ls(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k))}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function br(n,a){try{if(B&&typeof B[n]==='function'){return B[n].apply(B,a||[])}}catch(e){}return null}
function brj(n){var r=br(n);try{return typeof r==='string'?JSON.parse(r):r}catch(e){return null}}
var tt;function toast(m,k){var t=$('#toast');t.textContent=m;t.className='on '+(k||'');clearTimeout(tt);tt=setTimeout(function(){t.className=''},3800)}
function pushHist(){try{window.history.pushState({indrhi:Date.now()},'')}catch(e){}}
function closeOv(){clearMedia('emerg');clearMedia('board');$('#ov').innerHTML=''}
function openModal(h,c){pushHist();$('#ov').innerHTML='<div class="ov" data-act="ovclose"><div class="modal '+(c?'c':'')+'">'+h+'</div></div>'}
function confirmM(title,text,ok,color,withMedia){
 S._ok=ok;
 if(withMedia)clearMedia('emerg');
 var mHtml=withMedia?mediaPickerHtml('emerg','Foto o video (se guarda en Drive)'):'';
 openModal('<div class="ic">'+IC.alert.replace('<svg','<svg width="28" height="28"')+'</div><h2>'+esc(title)+'</h2><p class="mut">'+esc(text)+'</p>'+mHtml+'<div class="row"><button class="btn gray" data-act="cancel">Cancelar</button><button class="btn '+(color||'red')+'" data-act="okc">Confirmar</button></div>',true);
}
function getDevId(){var id=ls('indrhi.deviceId');if(!id){id='dev-'+Date.now()+'-'+Math.floor(Math.random()*1000000);ls('indrhi.deviceId',id)}return id}

function normSub(p){
 if(!p)return'';
 var s=String(p.subArea||'').trim();
 if(p.rol==='brigadista')return LEGACY_BRIG[s]||s;
 if(p.rol==='seguridad')return s||'Subalterno de Seguridad';
 return s;
}
function userBrigs(p){
 if(!p)return[];
 var seen={},out=[];
 function addB(raw){
  var nb=LEGACY_BRIG[String(raw||'').trim()]||String(raw||'').trim();
  if(!nb)return;
  var key=nb.toLowerCase();
  if(!seen[key]){seen[key]=true;out.push(nb)}
 }
 if(Array.isArray(p.brigadas)){
  p.brigadas.forEach(addB);
 }
 var sa=LEGACY_BRIG[String(p.subArea||'').trim()]||String(p.subArea||'').trim();
 if(BRIG.indexOf(sa)>=0)addB(sa);
 return out;
}

/* ---------- Permisos e Inmutabilidad de Admin Tecnología ---------- */
function me(){return S.session&&S.session.profile||{}}
function rol(){return me().rol||'colaborador'}
function isProtectedTechUser(u){
 if(!u)return false;
 var em=String(u.email||u.id||'').toLowerCase();
 return em===ADMIN_MAIL||(u.rol==='admin'&&u.subArea==='Tecnología');
}
function isTechAdmin(){
 var p=me();
 return String(p.email||'').toLowerCase()===ADMIN_MAIL||(p.rol==='admin'&&p.subArea==='Tecnología');
}
function isAdm(){
 var p=me();
 return isTechAdmin()||(p.rol==='admin'&&ADM_AREAS.indexOf(p.subArea)>=0);
}
function canPublishBoard(){
 var p=me();
 return isTechAdmin()||(p.rol==='admin'&&p.subArea==='Recursos Humanos');
}
function canSiren(){
 var p=me(),sub=normSub(p);
 if(isTechAdmin())return true;
 if(p.rol==='seguridad'&&sub==='Jefe de Seguridad')return true;
 if(p.rol==='admin'&&ADM_AREAS.indexOf(sub)>=0)return true;
 return false;
}
function isDispensario(p){
 return userBrigs(p).indexOf('Brigada Médica / Primeros Auxilios')>=0;
}
function isRRHH(p){
 return p.rol==='admin'&&p.subArea==='Recursos Humanos';
}
function isJefeSeg(p){
 return p.rol==='seguridad'&&normSub(p)==='Jefe de Seguridad';
}
function roleLabel(p){
 var sub=normSub(p);
 if(p.rol==='admin')return'Jefe / Admin'+(sub?' · '+sub:'');
 if(p.rol==='seguridad')return sub==='Jefe de Seguridad'?'Jefe de Seguridad':'Subalterno de Seguridad';
 if(p.rol==='brigadista')return'Brigadista';
 return'Colaborador';
}
/* Corregido: sin duplicación de brigadas en el encabezado */
function tag(p){
 var rl=roleLabel(p),brs=userBrigs(p);
 if(p.rol==='brigadista'){
  return brs.length?brs.join(' · '):'Brigadista';
 }
 if(brs.length){
  return rl+' · '+brs.join(' · ');
 }
 return rl;
}
function badgesHtml(p){
 var brs=userBrigs(p);
 var h='<span class="badge b">'+esc(roleLabel(p))+'</span>';
 brs.forEach(function(b){h+='<span class="badge g">'+esc(b)+'</span>'});
 return h;
}

/* ---------- Verificación GPS de 1 km (Anti-broma / Anti-activación accidental) ---------- */
function haversineMeters(lat1,lon1,lat2,lon2){
 var R=6371000,toRad=function(d){return d*Math.PI/180};
 var dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
 var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function getGpsCoords(){
 return new Promise(function(resolve,reject){
  if(!navigator.geolocation){reject(new Error('GPS no disponible en este dispositivo'));return}
  navigator.geolocation.getCurrentPosition(
   function(pos){resolve({lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy})},
   function(){reject(new Error('Activa la ubicación (GPS) del teléfono para verificar que estás en el INDRHI.'))},
   {enableHighAccuracy:true,timeout:9000,maximumAge:30000}
  );
 });
}
function verifyWithin1Km(enforce){
 if(!enforce||!S.geofenceOn||isTechAdmin()){
  return getGpsCoords().then(function(c){
   return{ok:true,lat:c.lat,lng:c.lng,dist:Math.round(haversineMeters(c.lat,c.lng,INDRHI_HQ.lat,INDRHI_HQ.lng))};
  }).catch(function(){return{ok:true}});
 }
 toast('Verificando ubicación dentro de 1 km del INDRHI...');
 return getGpsCoords().then(function(c){
  var dist=Math.round(haversineMeters(c.lat,c.lng,INDRHI_HQ.lat,INDRHI_HQ.lng));
  if(dist>INDRHI_HQ.radiusMeters){
   throw new Error('Bloqueado por seguridad: estás a '+(dist/1000).toFixed(2)+' km de la sede INDRHI (máximo permitido: 1.00 km).');
  }
  return{ok:true,lat:c.lat,lng:c.lng,dist:dist};
 });
}

/* ---------- Enrutamiento de Alertas e Incidentes ---------- */
function classifyIncident(o){
 var t=String(o.tipo||''),est=String(o.estado||'');
 if(est==='A salvo'||t==='Estoy a salvo')return'salvo';
 if(est==='Hay otras personas afectadas')return'varias';
 if(t==='Accidente'||t==='Necesito ayuda'||est==='Herido/a'||est==='Atrapado/a')return'una';
 return'estructural';
}
function recipientMatchesCategory(u,cat){
 if(cat==='estructural'){
  return isProtectedTechUser(u)||(u.rol==='admin'&&ADM_AREAS.indexOf(u.subArea)>=0)||isJefeSeg(u);
 }
 if(cat==='una'){
  return isDispensario(u)||isRRHH(u)||isJefeSeg(u)||isProtectedTechUser(u);
 }
 if(cat==='varias'){
  return isDispensario(u)||isRRHH(u)||u.rol==='seguridad'||isProtectedTechUser(u);
 }
 return false;
}
function incidentAppliesToMe(r){
 if(!r||r.atendido===true)return false;
 var cat=r.categoria||classifyIncident(r);
 if(cat==='salvo')return false;
 return recipientMatchesCategory(me(),cat);
}
function activeIncidentsForMe(){
 return allEmergReports().filter(function(r){
  return incidentAppliesToMe(r);
 }).slice(0,8);
}
function checkIncomingIncidents(){
 var list=activeIncidentsForMe();
 if(!list.length)return;
 var latest=list[0];
 var lid=latest.id||latest.creado||'';
 var seen=ls('indrhi.seenIncId')||'';
 if(lid&&lid!==seen){
  ls('indrhi.seenIncId',lid);
  var cat=latest.categoria||classifyIncident(latest);
  var prefix=cat==='estructural'?'ALERTA DE INCIDENTE: ':cat==='varias'?'EMERGENCIA MÚLTIPLE: ':'ATENCIÓN MÉDICA / SEGURIDAD: ';
  toast(prefix+(latest.tipo||'Incidente')+' en '+(latest.lugar||latest.ubicacion||'INDRHI'),'err');
  if(S.tab==='emg')render();
 }
}
function dispatchIncidentNotification(r){
 getWebhookUrl().then(function(wh){
  if(!wh)return;
  var cat=r.categoria||classifyIncident(r);
  if(cat==='salvo')return;

function compressImage(file){
 return new Promise(function(resolve){
  if(!file||file.size<240000){resolve(file);return}
  var img=new Image(),u=URL.createObjectURL(file);
  img.onload=function(){
   try{
    var max=1280,w=img.width,h=img.height;
    if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}
    var c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    c.toBlob(function(blob){URL.revokeObjectURL(u);resolve(blob||file)},'image/jpeg',0.78);
   }catch(e){URL.revokeObjectURL(u);resolve(file)}
  };
  img.onerror=function(){URL.revokeObjectURL(u);resolve(file)};
  img.src=u;
 });
}
function blobToBase64(blob){
 return new Promise(function(resolve,reject){
  var r=new FileReader();
  r.onload=function(){var res=String(r.result||''),idx=res.indexOf(',');resolve(idx>=0?res.slice(idx+1):res)};
  r.onerror=function(){reject(new Error('No se pudo leer el archivo'))};
  r.readAsDataURL(blob);
 });
}

  if(!isTechAdmin())return toast('Solo Jefe / Admin Tecnología puede eliminar perfiles','err');
  var u=S.users.filter(function(x){return x.id===a})[0];
  if(!u||isProtectedTechUser(u))return toast('No se puede eliminar el perfil de Tecnología','err');
  confirmM('¿Eliminar perfil permanentemente?','Se eliminará a '+u.nombre+' ('+u.email+') del sistema.',function(){
   fsDel('usuarios/'+encodeURIComponent(a)).then(function(){
    S.users=S.users.filter(function(x){return x.id!==a});
    render();
    toast('Perfil eliminado de Firestore','ok');
    if(u.uid){
     getWebhookUrl().then(function(wh){
      if(!wh)return;
      fetch(wh,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'deleteUser',secret:'INDRHI_ALERTA_2026',requester:S.session.email,targetUid:u.uid,targetEmail:u.email})}).catch(function(){});
     });
    }
   }).catch(function(x){toast('Error al eliminar: '+x.message,'err')});
  });
 },
 savegeo:function(){
  if(!isTechAdmin())return;
  var on=!!($('#geo-chk')&&$('#geo-chk').checked);
  fsSet('config/notificaciones',{geofence1Km:on},['geofence1Km']).then(function(){
   S.geofenceOn=on;
   toast(on?'Verificación de 1 km activada':'Verificación de 1 km desactivada','ok');
  }).catch(function(x){toast('Error: '+x.message,'err')});
 },
 savewh:function(){
  if(!isTechAdmin())return;
  var u=$('#wh').value.trim();
  fsSet('config/notificaciones',{webhookUrl:u},['webhookUrl']).then(function(){S.webhook=u;toast('URL guardada','ok')}).catch(function(x){toast('No se pudo guardar: '+x.message,'err')});
 },
 pubver:function(){
  if(!isTechAdmin())return;
  var c=Number($('#v-code').value),n=$('#v-name').value.trim(),u=$('#v-url').value.trim();
  if(!c||!n||!u)return toast('Completa código, nombre y URL','err');
  confirmM('¿Publicar la versión '+n+'?','Todos los teléfonos verán el aviso de actualización.',function(){fsSet('config/version',{latestVersionCode:c,latestVersionName:n,apkUrl:u,releaseNotes:$('#v-notes').value.trim(),actualizadoIso:new Date().toISOString()}).then(function(){toast('Versión publicada','ok');loadAll()}).catch(function(x){toast('No se pudo publicar: '+x.message,'err')})},'amber');
 }
};

function saveRole(id,r,s,brs){
 var cleanBrs=Array.isArray(brs)?brs:[];
 fsSet('usuarios/'+encodeURIComponent(id),{rol:r,subArea:s,brigadas:cleanBrs,rolSolicitado:null},['rol','subArea','brigadas','rolSolicitado']).then(function(){
  var u=S.users.filter(function(x){return x.id===id})[0];
  if(u){u.rol=r;u.subArea=s;u.brigadas=cleanBrs;delete u.rolSolicitado}
  toast('Rol y brigadas actualizados','ok');
  render();
 }).catch(function(x){toast('No se pudo guardar: '+x.message,'err')});
}
function loadWh(){fsGet('config/notificaciones').then(function(c){S.webhook=c.webhookUrl||'';if(typeof c.geofence1Km==='boolean')S.geofenceOn=c.geofence1Km;if(S.tab==='me'&&isAdm()&&!document.activeElement.id)render()}).catch(function(){})}

function notify(o){getWebhookUrl().then(function(wh){if(!wh)return;
 var d=o.destino,to=S.users.filter(function(u){
  var sub=normSub(u),brs=userBrigs(u);
  if(d==='Todos')return true;
  if(d==='Edificio ED1')return u.ubicacion===UBIC[0];
  if(d==='Edificio ED2')return u.ubicacion===UBIC[1];
  if(d==='Brigadistas (Todas)'||d==='Brigadistas')return u.rol==='brigadista'||brs.length>0;
  if(BRIG.indexOf(d)>=0)return brs.indexOf(d)>=0;
  if(d==='Seguridad (Todos)'||d==='Seguridad')return u.rol==='seguridad';
  if(d==='Jefe de Seguridad')return u.rol==='seguridad'&&sub==='Jefe de Seguridad';
  if(d==='Subalternos de Seguridad')return u.rol==='seguridad'&&sub==='Subalterno de Seguridad';
  return false;
 }).map(function(u){return u.email});
 if(!to.length)return;fetch(wh,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({secret:'INDRHI_ALERTA_2026',tipo:o.tipo,titulo:o.titulo,descripcion:o.descripcion,fechaEvento:o.fecha||'',fecha:o.fecha||'',enlace:o.enlace||'',destino:d,autor:o.autor,emails:to,destinatarios:to})}).then(function(){toast('Correos enviados a '+to.length+' personas','ok')}).catch(function(){toast('No se pudieron enviar los correos','err')})})}

function subw(){
 var r=$('#r-rol'),w=$('#r-subw');if(!r||!w)return;var v=r.value;
 var listHtml='<div class="chk-list">'+BRIG.map(function(b){
  return'<label class="chk-item"><input type="checkbox" class="reg-brig" value="'+esc(b)+'"><span>'+esc(b)+'</span></label>';
 }).join('')+'</div>';
 if(v==='brigadista'){
  w.innerHTML='<label>¿A cuál(es) brigada(s) perteneces? (Puedes marcar varias)</label>'+listHtml;
 }else if(v==='seguridad'){
  w.innerHTML='<p class="mut" style="margin:2px 0 8px">Ingresarás como <b>Subalterno de Seguridad</b>. El rango de Jefe de Seguridad solo puede asignarlo un Administrador.</p><label>¿Perteneces también a alguna brigada? (Opcional, puedes marcar una o varias)</label>'+listHtml;
 }else{
  w.innerHTML='';
 }
}

function ptipo(){
 var t=$('#p-tipo').value,e=$('#p-ex');
 if(t==='Curso'||t==='Reunión'){
  e.innerHTML='<label>Fecha y hora</label><input id="p-fec" type="datetime-local"><label>Enlace de '+(t==='Curso'?'material':'reunión')+'</label><input id="p-lnk" type="url" placeholder="https://">';
 }else if(t==='Encuesta'){
  if(!S.pollOpts||S.pollOpts.length<2)S.pollOpts=['',''];
  e.innerHTML='<div id="poll-opts-box"></div>';
  renderPollBuilder();
 }else{
  e.innerHTML='';
 }
}
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var f=A[el.getAttribute('data-act')];if(f)f(el.getAttribute('data-a'),el,e)});
document.addEventListener('change',function(e){var c=e.target.getAttribute&&e.target.getAttribute('data-chg');if(!c)return;
 if(c==='rol')subw();else if(c==='ptipo')ptipo();
 else if(c==='ub'){var p=me();p.ubicacion=e.target.value;p.edificio=e.target.value;saveSession();topics();syncDevice();fsSet('usuarios/'+encodeURIComponent(S.session.email),{ubicacion:p.ubicacion,edificio:p.ubicacion},['ubicacion','edificio']).then(function(){toast('Edificio actualizado','ok')}).catch(function(){toast('No se pudo guardar','err')})}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='cm')A.send();if(e.key==='Enter'&&e.target.id==='a-pass')doLogin()});
window.addEventListener('online',function(){bg();loadAll()});
loadSession();
if(S.session&&S.session.email){start()}else{S.session=null;render()}
})();
</script></body></html>

<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>INDRHI Emergencias</title>
<style>
:root{--red:#DC2626;--red2:#991B1B;--blue:#1D4ED8;--green:#16A34A;--amber:#D97706;--bg:#F1F5F9;--card:#fff;--tx:#0F172A;--mut:#64748B;--bd:#E2E8F0;--sh:0 2px 10px rgba(15,23,42,.08);--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#0B1220;--card:#162033;--tx:#F1F5F9;--mut:#94A3B8;--bd:#263247;--sh:0 2px 12px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}
header.top{background:var(--red2);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top b{font-size:17px}header.top small{opacity:.85;display:block;font-size:12px}
main{flex:1;overflow-y:auto;padding:14px 14px 90px}
nav.bot{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.bot button{flex:1;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mut);min-height:56px;cursor:pointer}
nav.bot button.on{color:var(--red)}
nav.bot svg{width:24px;height:24px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:0 0 6px}
.mut{color:var(--mut);font-size:13px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--blue);color:#fff;width:100%;min-height:48px;cursor:pointer}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}.btn.amber{background:var(--amber)}.btn.gray{background:var(--bd);color:var(--tx)}
.btn.sm{width:auto;padding:8px 12px;min-height:36px;font-size:13px;border-radius:10px}
.row{display:flex;gap:10px}.row>*{flex:1}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);margin:4px 0 10px}
label{font-size:13px;color:var(--mut);font-weight:600}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--mut)}
.badge.g{background:#DCFCE7;color:#166534}.badge.a{background:#FEF3C7;color:#92400E}.badge.r{background:#FEE2E2;color:#991B1B}.badge.b{background:#DBEAFE;color:#1E40AF}
.siren{display:flex;align-items:center;gap:14px}
.dot{width:54px;height:54px;border-radius:50%;background:var(--green);flex:none}
.dot.on{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.6)}100%{box-shadow:0 0 0 22px rgba(220,38,38,0)}}
@media(prefers-reduced-motion:reduce){.dot.on{animation:none}}
.banner{background:var(--blue);color:#fff;border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.banner .btn{background:#fff;color:var(--blue);margin-top:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90%;overflow:auto}
.modal .ic{width:52px;height:52px;border-radius:50%;background:#FEF3C7;color:var(--amber);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.modal.c{text-align:center}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0F172A;color:#fff;padding:11px 18px;border-radius:14px;z-index:99;max-width:88%;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}#toast.ok{background:var(--green)}#toast.err{background:var(--red2)}
.auth{min-height:100%;padding:calc(30px + env(safe-area-inset-top)) 18px 30px;max-width:460px;margin:0 auto}
.auth h1{font-size:24px;margin:0 0 4px}
.tabs{display:flex;background:var(--bd);border-radius:14px;padding:4px;margin:16px 0}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font-weight:700;color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.bar{height:26px;border-radius:8px;background:var(--bd);position:relative;overflow:hidden;margin:6px 0;cursor:pointer}
.bar i{position:absolute;inset:0 auto 0 0;background:#BFDBFE;display:block}
.bar span{position:relative;display:flex;justify-content:space-between;padding:4px 10px;font-size:13px}
.msgs{height:calc(100vh - 290px);min-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.msg{max-width:82%;padding:8px 12px;border-radius:16px;background:var(--card);box-shadow:var(--sh);align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff}
.msg small{display:block;font-size:11px;opacity:.75}
.hl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}.hl:last-child{border:0}
.led{width:14px;height:14px;border-radius:50%;flex:none}.led.g{background:var(--green)}.led.r{background:var(--red)}
.opt{border:2px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:8px;font-weight:600;cursor:pointer;background:var(--card);width:100%;text-align:left}
.pre{word-break:break-all;font-size:12px;background:var(--bg);padding:8px;border-radius:10px;margin:6px 0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style></head><body>
<div id="app"></div><div id="ov"></div><div id="toast"></div>
<script>
(function(){
var B=window.IndrhiBridge,ADMIN_MAIL='ajfeliz@indrhi.gob.do';
var FS='https://firestore.googleapis.com/v1/projects/indrhi-emergencias/databases/(default)/documents';
var DEFAULT_APK_URL='https://github.com/angelcruz3102-hub/indrhi-emergencias-v2/releases/latest/download/app-debug.apk';
var BRIG=['Brigada de Evacuación','Brigada de Primeros Auxilios','Brigada Contra Incendios','Brigada de Búsqueda y Rescate'];
var UBIC=['Edificio ED1','Edificio ED2','Exterior / Regional'];
var TOPICS={'Edificio ED1':'indrhi_ed1','Edificio ED2':'indrhi_ed2','Exterior / Regional':'indrhi_exterior'};
var ROOMS=[{id:'grupo_general',nombre:'Chat General INDRHI'},{id:'grupo_brigadistas',nombre:'Brigadistas INDRHI'},{id:'grupo_seguridad',nombre:'Seguridad INDRHI'},{id:'grupo_ed1',nombre:'Edificio ED1'},{id:'grupo_ed2',nombre:'Edificio ED2'}];
var TIPOS=['Información','Curso','Reunión','Encuesta','Reporte'];
var DEST=['Todos','Edificio ED1','Edificio ED2','Brigadistas','Seguridad'];
var IC={
 alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18h.01"/></svg>',
 board:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
 chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-12 7l-5 1 1-4a8 8 0 1 1 16-4z"/></svg>',
 user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>'};
var S={tab:'emg',filter:'Todos',session:null,posts:[],users:[],groups:[],room:null,msgs:[],ver:null,health:null,fcm:'',upd:'',updState:'',sirena:false,R:{step:0},mode:'login',busy:false,cfg:null,adminQ:''};
var $=function(s){return document.querySelector(s)};
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ls(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k))}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function br(n,a){try{if(B&&typeof B[n]==='function'){return B[n].apply(B,a||[])}}catch(e){}return null}
function brj(n){var r=br(n);try{return typeof r==='string'?JSON.parse(r):r}catch(e){return null}}
var tt;function toast(m,k){var t=$('#toast');t.textContent=m;t.className='on '+(k||'');clearTimeout(tt);tt=setTimeout(function(){t.className=''},3200)}
function closeOv(){$('#ov').innerHTML=''}
function openModal(h,c){$('#ov').innerHTML='<div class="ov" data-act="ovclose"><div class="modal '+(c?'c':'')+'">'+h+'</div></div>'}
function confirmM(title,text,ok,color){
 S._ok=ok;openModal('<div class="ic">'+IC.alert.replace('<svg','<svg width="28" height="28"')+'</div><h2>'+esc(title)+'</h2><p class="mut">'+esc(text)+'</p><div class="row"><button class="btn gray" data-act="cancel">Cancelar</button><button class="btn '+(color||'red')+'" data-act="okc">Confirmar</button></div>',true)}
function getDevId(){var id=ls('indrhi.deviceId');if(!id){id='dev-'+Date.now()+'-'+Math.floor(Math.random()*1000000);ls('indrhi.deviceId',id)}return id}
/* ---------- Firestore ---------- */
function toFS(v){if(v===null||v===undefined)return{nullValue:null};if(typeof v==='string')return{stringValue:v};if(typeof v==='boolean')return{booleanValue:v};if(typeof v==='number')return Math.floor(v)===v?{integerValue:String(v)}:{doubleValue:v};if(Array.isArray(v))return{arrayValue:{values:v.map(toFS)}};var f={};for(var k in v)f[k]=toFS(v[k]);return{mapValue:{fields:f}}}
function fromFS(v){if('stringValue'in v)return v.stringValue;if('integerValue'in v)return Number(v.integerValue);if('doubleValue'in v)return v.doubleValue;if('booleanValue'in v)return v.booleanValue;if('arrayValue'in v)return(v.arrayValue.values||[]).map(fromFS);if('mapValue'in v)return fields(v.mapValue.fields||{});return null}
function fields(f){var o={};for(var k in f)o[k]=fromFS(f[k]);return o}
function doc(d){var o=fields(d.fields||{});o.id=decodeURIComponent(d.name.split('/').pop());return o}
function toFields(o){var f={};for(var k in o)f[k]=toFS(o[k]);return f}
function cfg(){if(S.cfg)return S.cfg;var c=brj('getFirebaseConfig');S.cfg=(c&&c.apiKey)?c:{apiKey:'',projectId:'indrhi-emergencias'};return S.cfg}
function http(method,url,body,auth,retry){
 return Promise.resolve(auth?ensure():null).then(function(){
  var h={'Content-Type':'application/json'};if(auth&&S.session)h.Authorization='Bearer '+S.session.idToken;
  return fetch(url,{method:method,headers:h,body:body?JSON.stringify(body):undefined})}).then(function(r){
  return r.json().catch(function(){return{}}).then(function(j){
   if(r.status===401&&auth&&!retry&&S.session){S.session.expiresAt=0;return http(method,url,body,auth,true)}
   if(!r.ok)throw new Error((j.error&&(j.error.message||j.error))||('HTTP '+r.status));return j})})}
function ensure(){var s=S.session;if(!s||!s.refreshToken||Date.now()<s.expiresAt-60000)return;
 return fetch('https://securetoken.googleapis.com/v1/token?key='+cfg().apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(s.refreshToken)}).then(function(r){return r.json()}).then(function(j){
  if(j.id_token){s.idToken=j.id_token;s.refreshToken=j.refresh_token||s.refreshToken;s.expiresAt=Date.now()+Number(j.expires_in)*1000;saveSession()}}).catch(function(){})}
function fsList(col,qs){return http('GET',FS+'/'+col+(qs?'?'+qs:''),null,true).then(function(j){return(j.documents||[]).map(doc)})}
function fsGet(p){return http('GET',FS+'/'+p,null,true).then(doc)}
function fsAdd(col,o,id){return http('POST',FS+'/'+col+(id?'?documentId='+encodeURIComponent(id):''),{fields:toFields(o)},true)}
function fsSet(p,o,mask){var q=mask?'?'+mask.map(function(m){return'updateMask.fieldPaths='+encodeURIComponent(m)}).join('&'):'';return http('PATCH',FS+'/'+p+q,{fields:toFields(o)},true)}
/* ---------- Sesión ---------- */
function saveSession(){var s=S.session;if(!s)return;var p=s.profile||{};var j=JSON.stringify({email:s.email,uid:s.uid,idToken:s.idToken,refreshToken:s.refreshToken,expiresAt:s.expiresAt,nombre:p.nombre||'',edificio:p.ubicacion||'',rol:p.rol||'colaborador',subArea:p.subArea||'',rolSolicitado:p.rolSolicitado||'',profile:p});try{localStorage.setItem('indrhi.authSession',j)}catch(e){}br('saveAuthSession',[j])}
function loadSession(){var j=br('getAuthSession'),l=null,o=null;try{l=localStorage.getItem('indrhi.authSession')}catch(e){}
 if(typeof j==='string'&&j&&j!=='null'){try{o=JSON.parse(j)}catch(e){o=null}}
 if(!o||!o.email){try{o=l?JSON.parse(l):null}catch(e){o=null}}
 if(!o||!o.email)return null;
 var p=o.profile||{};p.email=o.email;p.uid=o.uid;p.nombre=p.nombre||o.nombre||o.email.split('@')[0];p.ubicacion=p.ubicacion||o.edificio||UBIC[0];p.rol=p.rol||o.rol||'colaborador';p.subArea=p.subArea||o.subArea||'';if(o.rolSolicitado&&!p.rolSolicitado)p.rolSolicitado=o.rolSolicitado;
 o.profile=p;S.session=o;saveSession();return o}
function me(){return S.session&&S.session.profile||{}}
function rol(){return me().rol||'colaborador'}
function canPub(){return['admin','brigadista','seguridad'].indexOf(rol())>=0}
function isAdm(){var p=me();return p.rol==='admin'&&(p.subArea==='Tecnología'||p.subArea==='Recursos Humanos'||p.email===ADMIN_MAIL)}
function tag(p){return p.rol==='brigadista'?(p.subArea||'Brigadista'):p.rol==='admin'?('Admin'+(p.subArea?' · '+p.subArea:'')):p.rol==='seguridad'?'Seguridad':'Colaborador'}
function authErr(m){var x={EMAIL_EXISTS:'Ese correo ya está registrado.',INVALID_LOGIN_CREDENTIALS:'Correo o contraseña incorrectos.',INVALID_PASSWORD:'Contraseña incorrecta.',EMAIL_NOT_FOUND:'No existe una cuenta con ese correo.',WEAK_PASSWORD:'La contraseña debe tener al menos 6 caracteres.'};
 for(var k in x)if(String(m).indexOf(k)===0)return x[k];return 'No se pudo completar: '+m}
function doLogin(){
 if(S.busy)return;
 var e=$('#a-mail').value.trim().toLowerCase(),p=$('#a-pass').value;
 if(!/@indrhi\.gob\.do$/.test(e))return toast('Usa tu correo @indrhi.gob.do','err');if(!p)return toast('Escribe tu contraseña','err');
 if(!cfg().apiKey)return toast('Sin conexión con la app: abre INDRHI Emergencias en el teléfono','err');
 S.busy=true;http('POST','https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+cfg().apiKey,{email:e,password:p,returnSecureToken:true}).then(function(j){
  S.session={idToken:j.idToken,refreshToken:j.refreshToken,uid:j.localId,email:e,expiresAt:Date.now()+Number(j.expiresIn)*1000,profile:{email:e}};
  var uPath='usuarios/'+encodeURIComponent(e);
  return fsGet(uPath).catch(function(){var pr={uid:j.localId,nombre:e.split('@')[0],email:e,ubicacion:UBIC[0],edificio:UBIC[0],rol:e===ADMIN_MAIL?'admin':'colaborador',subArea:e===ADMIN_MAIL?'Tecnología':''};return fsSet(uPath,pr).then(function(){return pr})})
 }).then(function(pr){
  pr.ubicacion=pr.ubicacion||pr.edificio||UBIC[0];
  S.session.profile=pr;
  if(e===ADMIN_MAIL&&pr.rol!=='admin'){pr.rol='admin';pr.subArea=pr.subArea||'Tecnología';fsSet('usuarios/'+encodeURIComponent(e),pr,['rol','subArea'])}
  saveSession();start()
 }).catch(function(x){toast(authErr(x.message),'err')}).then(function(){S.busy=false})}
function doReg(){
 if(S.busy)return;
 var n=$('#r-name').value.trim(),e=$('#r-mail').value.trim().toLowerCase(),p=$('#r-pass').value,u=$('#r-ub').value,r=$('#r-rol').value,s=$('#r-sub')?$('#r-sub').value:'';
 if(!n)return toast('Escribe tu nombre completo','err');if(!/@indrhi\.gob\.do$/.test(e))return toast('Solo se permiten correos @indrhi.gob.do','err');
 if(p.length<6)return toast('La contraseña debe tener al menos 6 caracteres','err');if((r==='brigadista'||r==='admin')&&!s)return toast('Elige '+(r==='admin'?'el departamento':'tu brigada'),'err');
 if(!cfg().apiKey)return toast('Sin conexión con la app: abre INDRHI Emergencias en el teléfono','err');
 var pr={nombre:n,email:e,ubicacion:u,edificio:u,rol:'colaborador',subArea:''};
 if(e===ADMIN_MAIL){pr.rol='admin';pr.subArea=s||'Tecnología'}else if(r==='brigadista'){pr.rol='brigadista';pr.subArea=s}else if(r==='seguridad'){pr.rol='seguridad'}else if(r==='admin'){pr.rolSolicitado='admin';pr.subArea=s}
 S.busy=true;http('POST','https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+cfg().apiKey,{email:e,password:p,returnSecureToken:true}).then(function(j){
  pr.uid=j.localId;S.session={idToken:j.idToken,refreshToken:j.refreshToken,uid:j.localId,email:e,expiresAt:Date.now()+Number(j.expiresIn)*1000,profile:pr};
  return fsSet('usuarios/'+encodeURIComponent(e),pr)}).then(function(){saveSession();start();if(pr.rolSolicitado)toast('Solicitud de Administrador enviada. Un admin de Tecnología o RRHH debe aprobarla.','ok')}).catch(function(x){S.session=null;toast(authErr(x.message),'err')}).then(function(){S.busy=false})}
function logout(){confirmM('Cerrar sesión','Dejarás de recibir avisos en este teléfono hasta que vuelvas a entrar.',function(){br('clearAuthSession');try{localStorage.removeItem('indrhi.authSession')}catch(e){}S.session=null;clearInterval(S.poll);render()},'blue')}
/* ---------- Arranque ---------- */
function readToken(){var r=brj('getFcmToken');var t=(r&&r.ok&&r.token)?r.token:(typeof r==='string'&&r.charAt(0)!=='{'?r:'');if(t){S.fcm=t;try{localStorage.setItem('indrhi.fcmToken',t)}catch(e){}}else if(!S.fcm){try{S.fcm=localStorage.getItem('indrhi.fcmToken')||''}catch(e){}}return S.fcm}
function topics(){var t=TOPICS[me().ubicacion];br('subscribeTopic',['indrhi_todos']);for(var k in TOPICS){if(TOPICS[k]===t)br('subscribeTopic',[t]);else br('unsubscribeTopic',[TOPICS[k]])}}
function syncDevice(){if(!S.session||!S.fcm)return;var cx=brj('getContext')||{},p=me(),devId=getDevId(),mod=((cx.manufacturer||'')+' '+(cx.model||'')).trim()||'Android';
 fsSet('dispositivos/'+encodeURIComponent(devId),{deviceId:devId,nombre:p.nombre||'',correo:S.session.email,rol:p.rol||'colaborador',subArea:p.subArea||'',edificio:p.ubicacion||UBIC[0],topicEdificio:TOPICS[p.ubicacion]||'indrhi_ed1',fcmToken:S.fcm,modelo:mod,versionApp:String(cx.versionName||'1.0.0'),actualizadoIso:new Date().toISOString()}).catch(function(){})}
function start(){S.tab='emg';topics();readToken();loadAll();syncDevice();render();syncQ();
 clearInterval(S.poll);S.poll=setInterval(function(){if(Date.now()-(S.lb||0)>30000){S.lb=Date.now();bg()}S.sirena=br('isAlarmPlaying')===true;if(S.tab==='emg')updSiren();if(S.tab==='chat'&&S.room)loadMsgs()},4000)}
function bg(){if(!S.session)return;Promise.resolve(ensure()).then(syncQ)}
function loadAll(){
 fsGet('usuarios/'+encodeURIComponent(S.session.email)).then(function(p){if(p&&p.email&&S.session){p.ubicacion=p.ubicacion||p.edificio||UBIC[0];S.session.profile=Object.assign({},S.session.profile,p);saveSession();syncDevice();render()}}).catch(function(){});
 fsGet('config/version').then(function(v){S.ver=v;render()}).catch(function(){});
 fsList('comunicados','orderBy=creado%20desc&pageSize=60').then(function(a){S.posts=a;if(S.tab==='board')render()}).catch(function(){});
 fsList('usuarios','pageSize=300').then(function(a){S.users=a;if(S.tab==='me'||S.tab==='chat')render()}).catch(function(){});
 fsList('chat_grupos','pageSize=100').then(function(a){S.groups=a}).catch(function(){});
 S.health=brj('getHealth');S.sirena=br('isAlarmPlaying')===true}
window.onFcmToken=function(t){if(!t)return;S.fcm=t;try{localStorage.setItem('indrhi.fcmToken',t)}catch(e){}if(S.tab==='me')render();syncDevice()};
window.onUpdateDownloadState=function(st,d){S.updState=st;S.upd=d||st;if(S.tab==='emg'||S.tab==='me')render()};
window.refreshHealth=function(){S.health=brj('getHealth');if(S.tab==='me')render()};
/* ---------- Reportes ---------- */
function queue(){return ls('indrhi.reportes')||[]}
function syncQ(){var q=queue();q.filter(function(r){return!r.synced}).forEach(function(r){

 savewh:function(){var u=$('#wh').value.trim();fsSet('config/notificaciones',{webhookUrl:u},['webhookUrl']).then(function(){S.webhook=u;toast('Webhook guardado','ok')}).catch(function(x){toast('No se pudo guardar: '+x.message,'err')})},
 pubver:function(){var c=Number($('#v-code').value),n=$('#v-name').value.trim(),u=$('#v-url').value.trim();if(!c||!n||!u)return toast('Completa código, nombre y URL','err');
  confirmM('¿Publicar la versión '+n+'?','Todos los teléfonos verán el aviso de actualización.',function(){fsSet('config/version',{latestVersionCode:c,latestVersionName:n,apkUrl:u,releaseNotes:$('#v-notes').value.trim(),actualizadoIso:new Date().toISOString()}).then(function(){toast('Versión publicada','ok');loadAll()}).catch(function(x){toast('No se pudo publicar: '+x.message,'err')})},'amber')}
};
function saveRole(id,r,s){fsSet('usuarios/'+encodeURIComponent(id),{rol:r,subArea:s,rolSolicitado:null},['rol','subArea','rolSolicitado']).then(function(){var u=S.users.filter(function(x){return x.id===id})[0];if(u){u.rol=r;u.subArea=s;delete u.rolSolicitado}toast('Rol actualizado','ok');render()}).catch(function(x){toast('No se pudo guardar: '+x.message,'err')})}
function loadWh(){fsGet('config/notificaciones').then(function(c){S.webhook=c.webhookUrl||'';if(S.tab==='me'&&isAdm()&&!document.activeElement.id)render()}).catch(function(){})}
function notify(o){fsGet('config/notificaciones').then(function(c){if(!c.webhookUrl)return;
 var d=o.destino,to=S.users.filter(function(u){return d==='Todos'||(d==='Edificio ED1'&&u.ubicacion===UBIC[0])||(d==='Edificio ED2'&&u.ubicacion===UBIC[1])||(d==='Brigadistas'&&u.rol==='brigadista')||(d==='Seguridad'&&u.rol==='seguridad')}).map(function(u){return u.email});
 if(!to.length)return;fetch(c.webhookUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({secret:'INDRHI_ALERTA_2026',tipo:o.tipo,titulo:o.titulo,descripcion:o.descripcion,fechaEvento:o.fecha||'',fecha:o.fecha||'',enlace:o.enlace||'',destino:d,autor:o.autor,emails:to,destinatarios:to})}).then(function(){toast('Correos enviados a '+to.length+' personas','ok')}).catch(function(){toast('No se pudieron enviar los correos','err')})}).catch(function(){})}
function subw(){var r=$('#r-rol'),w=$('#r-subw');if(!r||!w)return;var v=r.value;
 w.innerHTML=v==='brigadista'?'<label>Brigada</label><select id="r-sub">'+BRIG.map(function(b){return'<option>'+b+'</option>'}).join('')+'</select>':v==='admin'?'<label>Departamento</label><select id="r-sub"><option>Tecnología</option><option>Recursos Humanos</option></select><p class="mut">Un administrador de Tecnología o RRHH debe aprobar tu solicitud. Mientras tanto tendrás rol de colaborador.</p>':''}
function ptipo(){var t=$('#p-tipo').value,e=$('#p-ex');e.innerHTML=(t==='Curso'||t==='Reunión')?'<label>Fecha y hora</label><input id="p-fec" type="datetime-local"><label>Enlace de '+(t==='Curso'?'material':'reunión')+'</label><input id="p-lnk" type="url" placeholder="https://">':t==='Encuesta'?'<label>Opciones (una por línea)</label><textarea id="p-opc" rows="4"></textarea>':''}
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var f=A[el.getAttribute('data-act')];if(f)f(el.getAttribute('data-a'),el,e)});
document.addEventListener('change',function(e){var c=e.target.getAttribute&&e.target.getAttribute('data-chg');if(!c)return;
 if(c==='rol')subw();else if(c==='ptipo')ptipo();
 else if(c==='ub'){var p=me();p.ubicacion=e.target.value;p.edificio=e.target.value;saveSession();topics();syncDevice();fsSet('usuarios/'+encodeURIComponent(S.session.email),{ubicacion:p.ubicacion,edificio:p.ubicacion},['ubicacion','edificio']).then(function(){toast('Edificio actualizado','ok')}).catch(function(){toast('No se pudo guardar','err')})}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='cm')A.send();if(e.key==='Enter'&&e.target.id==='a-pass')doLogin()});
window.addEventListener('online',function(){bg();loadAll()});
loadSession();
if(S.session&&S.session.email){start()}else{S.session=null;render()}
})();
